name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Project Pages site, not a user/org site at the domain root.
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Actions is the Pages source. The site must exist before deploy-pages runs.
      # GITHUB_TOKEN here has pages:write from the workflow permissions above.
      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if gh api "repos/${repo}/pages" >/dev/null 2>&1; then
            gh api --method PUT "repos/${repo}/pages" -f build_type=workflow >/dev/null
          else
            gh api --method POST "repos/${repo}/pages" -f build_type=workflow >/dev/null
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
